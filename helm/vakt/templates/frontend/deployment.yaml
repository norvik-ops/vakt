apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vakt.fullname" . }}-frontend
  labels:
    {{- include "vakt.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "vakt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "vakt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ include "vakt.ownImageTag" (dict "repository" .Values.image.frontend.repository "tag" .Values.image.frontend.tag) }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          securityContext:
            # nginx needs to write to /var/cache/nginx and /var/run.
            # readOnlyRootFilesystem is disabled here; the writable dirs are
            # provided via emptyDir volumes below.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # NET_BIND_SERVICE required to bind nginx to port 80 as nonroot.
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
