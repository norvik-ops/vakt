apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vakt.fullname" . }}-api
  labels:
    {{- include "vakt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "vakt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "vakt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ include "vakt.ownImageTag" (dict "repository" .Values.image.api.repository "tag" .Values.image.api.tag) }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "vakt.fullname" . }}-config
            - secretRef:
                name: {{ include "vakt.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.uploads.persistence.enabled }}
            - name: uploads
              mountPath: /app/data/uploads
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.uploads.persistence.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "vakt.fullname" . }}-uploads
        {{- end }}
