{{- include "vakt.validateSecrets" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vakt.fullname" . }}-secrets
  labels:
    {{- include "vakt.labels" . | nindent 4 }}
type: Opaque
stringData:
  VAKT_DB_URL: {{ include "vakt.dbUrl" . | quote }}
  VAKT_REDIS_URL: {{ include "vakt.redisUrl" . | quote }}
  VAKT_SECRET_KEY: {{ required "secrets.secretKey must be set (64 hex chars)" .Values.secrets.secretKey | quote }}
